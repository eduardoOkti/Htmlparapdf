name: Build Extension

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/actions-node@v3
      with:
        node-version: 16

    - name: Install Rush CLI
      run: npm install -g @appinventor-community/rush

    - name: Build Extension with Rush
      run: rush build

    - name: Upload .aix artifact
      uses: actions/upload-artifact@v3
      with:
        name: Htmlparapdf
        path: out/*.aix
