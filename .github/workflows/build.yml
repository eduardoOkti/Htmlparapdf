name: Build Extension

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Rush CLI
      run: |
        curl -fsSL https://raw.githubusercontent.com/zainulhassan815/rush-cli/main/scripts/install/install.sh | bash
        echo "$HOME/.rush/bin" >> $GITHUB_PATH

    - name: Build Extension with Rush
      run: rush build

    - name: Upload .aix artifact
      uses: actions/upload-artifact@v4
      with:
        name: Htmlparapdf
        path: out/*.aix
