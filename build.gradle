plugins {
    id 'java'
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://repo.maven.apache.org/maven2' }
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Dependência do Android SDK padrão fornecida pelo Google
    compileOnly 'com.google.android:android:4.1.1.4'
    
    // Dependências do App Inventor para compilação de extensões
    compileOnly 'com.google.appinventor:components:3.0'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
}
